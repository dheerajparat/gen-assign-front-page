<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Roboto', sans-serif;
}

body {
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    padding: 15px;
    overflow-x: hidden;
}

/* Layout */
.container {
    max-width: 1200px;
    margin: auto;
}

.content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* Responsive */
@media (max-width: 1000px) {
    .content {
        grid-template-columns: 1fr;
    }
}

/* Form */
.form-container {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
}

.form-group {
    margin-bottom: 15px;
}

label {
    font-weight: 500;
}

input, select {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

@media (max-width: 600px) {
    .form-row {
        grid-template-columns: 1fr;
    }
}

/* Buttons */
.btn {
    padding: 10px 15px;
    border: none;
    background: #3498db;
    color: #fff;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
}

.btn-print {
    background: #27ae60;
}

/* Preview Wrapper */
.preview-wrapper {
    width: 100%;
    overflow-x: auto;
    display: flex;
    justify-content: center;
}

/* PRINT TEMPLATE (UNCHANGED CORE) */
.assignment-page {
    background: #fff;
    width: 21cm;
    min-height: 29.7cm;
    transform-origin: top center;
}

/* Scaling only for screen */
@media (max-width: 768px) {
    .assignment-page {
        transform: scale(0.7);
    }
}

@media (max-width: 500px) {
    .assignment-page {
        transform: scale(0.55);
    }
}

/* ===== ORIGINAL PRINT DESIGN ===== */

.header {
    text-align: center;
    padding-top: 40px;
}

.header h2 {
    font-size: 2.5rem;
    color: #15355b;
}

.assignment-title {
    text-align: center;
}

.assignment-title img {
    height: 200px;
}

.assignment-title h2 {
    color: red;
    text-decoration: underline;
}

.assignment-title h4 {
    color: #175a9c;
}

.info-section {
    margin-top: 40px;
    padding: 0 60px;
}

.info-row {
    display: flex;
    margin-bottom: 20px;
}

.info-label {
    width: 200px;
    font-weight: bold;
}

.signatures {
    display: flex;
    justify-content: space-between;
    margin-top: 80px;
    padding: 0 60px;
}

/* PRINT SAFE */
@media print {
    body * {
        visibility: hidden;
    }

    .assignment-page, .assignment-page * {
        visibility: visible;
    }

    .assignment-page {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<div class="container">

<div class="content">

<!-- FORM -->
<div class="form-container">
<h2>Enter Details</h2>

<div class="form-group">
<label>Subject</label>
<input id="subject">
</div>

<div class="form-group">
<label>Subject Code</label>
<input id="subjectCode">
</div>

<div class="form-group">
<label>Topic</label>
<input id="topic">
</div>

<div class="form-group">
<label>Date</label>
<input type="date" id="date">
</div>

<div class="form-group">
<label>Name</label>
<input id="name">
</div>

<div class="form-row">
<input id="reg" placeholder="Registration">
<input id="roll" placeholder="Roll">
</div>

<div class="form-group">
<select id="branch">
<option>Electronics Engineering</option>
<option>Computer Engineering</option>
</select>
</div>

<button class="btn" onclick="generate()">Generate</button>
<button class="btn btn-print" onclick="window.print()">Print</button>

</div>

<!-- PREVIEW -->
<div class="preview-wrapper">
<div class="assignment-page" id="page">

<div class="header">
<h2>Government Polytechnic Aurangabad</h2>
<p>At :- DHANARI(824102)</p>
</div>

<div class="assignment-title">
<img src="logo.png">
<h2>Assignment</h2>
<h4 id="outSub"></h4>
</div>

<div class="info-section">
<div class="info-row">
<div class="info-label">Topic :-</div>
<div id="outTopic"></div>
</div>

<div class="info-row">
<div class="info-label">Date :-</div>
<div id="outDate"></div>
</div>

<div class="info-row">
<div class="info-label">Name :-</div>
<div id="outName"></div>
</div>

<div class="info-row">
<div class="info-label">Reg :-</div>
<div id="outReg"></div>
</div>

<div class="info-row">
<div class="info-label">Branch :-</div>
<div id="outBranch"></div>
</div>

<div class="info-row">
<div class="info-label">Roll :-</div>
<div id="outRoll"></div>
</div>
</div>

<div class="signatures">
<div>Student Signature</div>
<div>Teacher Signature</div>
</div>

</div>
</div>

</div>
</div>

<script>
function generate() {
document.getElementById("outSub").innerText =
document.getElementById("subject").value + " (" +
document.getElementById("subjectCode").value + ")";

document.getElementById("outTopic").innerText =
document.getElementById("topic").value;

document.getElementById("outDate").innerText =
document.getElementById("date").value;

document.getElementById("outName").innerText =
document.getElementById("name").value;

document.getElementById("outReg").innerText =
document.getElementById("reg").value;

document.getElementById("outBranch").innerText =
document.getElementById("branch").value;

document.getElementById("outRoll").innerText =
document.getElementById("roll").value;
}
</script>

</body>
</html>
