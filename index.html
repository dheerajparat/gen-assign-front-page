<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/logo.png">
    <title>Assignment Generator</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f1f5f9;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --paper-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Roboto', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* ===== LAYOUT ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 3rem;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                padding: 1rem;
                gap: 2rem;
            }
            
            /* Mobile par sticky behavior hata diya gaya hai taaki preview asani se dikhe */
            .form-container {
                position: relative !important;
                top: 0 !important;
            }
        }

        /* ===== FORM DESIGN ===== */
        .form-container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 2rem;
        }

        .form-container h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-print {
            width: 100%;
            padding: 1rem;
            border: none;
            background: var(--primary);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            margin-top: 1rem;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-print:hover {
            background: var(--primary-hover);
        }

        /* ===== PREVIEW / A4 PAPER DESIGN ===== */
        .preview-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* Using Container Queries so fonts and padding scale perfectly 
           regardless of the screen size, maintaining the exact A4 look.
        */
        .assignment-page {
            container-type: inline-size;
            background: #fff;
            width: 100%;
            max-width: 21cm; /* Standard A4 width limit for big screens */
            aspect-ratio: 210 / 297; /* Exact A4 Ratio */
            box-shadow: var(--paper-shadow);
            border-radius: 4px;
            padding: 8cqi; /* 8% of container width */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 4cqi;
        }

        .header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 5cqi;
            color: #15355b;
            text-transform: uppercase;
            font-weight: 700;
        }

        .header p {
            font-size: 3cqi;
            color: #333;
            margin-top: 1cqi;
            font-weight: 500;
        }

        .assignment-title {
            text-align: center;
            margin-bottom: 6cqi;
        }

        .assignment-title img {
            height: 18cqi; /* Responsive height for the logo */
            margin: 2cqi auto;
            display: block;
            mix-blend-mode: multiply; /* Yeh line white background ko hata degi */
        }

        .assignment-title h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 5.5cqi;
            color: #d32f2f;
            text-decoration: underline;
            text-underline-offset: 4px;
            margin-bottom: 1cqi;
        }

        .assignment-title h4 {
            font-size: 3.5cqi;
            color: #175a9c;
            font-weight: 600;
        }

        .info-section {
            padding: 0 4cqi;
            flex-grow: 1;
        }

        .info-row {
            display: flex;
            margin-bottom: 3.5cqi;
            align-items: flex-end;
            font-size: 3.2cqi;
        }

        .info-label {
            font-weight: 600;
            width: 22cqi;
            color: #222;
        }

        .info-value {
            flex: 1;
            border-bottom: 1px dashed #718096;
            padding-bottom: 0.5cqi;
            color: #1a202c;
            min-height: 4cqi; /* Ensures empty fields still show a line */
            font-family: 'Poppins', sans-serif;
        }

        .signatures {
            display: flex;
            justify-content: space-between;
            padding: 0 4cqi;
            margin-top: 10cqi;
            font-size: 3.2cqi;
            font-weight: 600;
        }

        .signature-box {
            text-align: center;
            border-top: 1px solid #000;
            padding-top: 1cqi;
            width: 35cqi;
        }

        /* ===== PRINT STYLES ===== */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            body {
                background: none;
                margin: 0;
                padding: 0;
            }

            .form-container {
                display: none; /* Hide form when printing */
            }

            .container {
                display: block;
                padding: 0;
                margin: 0;
                max-width: none;
            }

            .preview-wrapper {
                justify-content: flex-start;
            }

            .assignment-page {
                box-shadow: none;
                max-width: none;
                width: 21cm;
                height: 29.7cm; /* Fixed exact size for A4 print */
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <!-- FORM -->
    <div class="form-container">
        <h2>Enter Details</h2>

        <div class="form-group">
            <label>Subject</label>
            <input id="subject" placeholder="e.g. Embedded Systems">
        </div>

        <div class="form-group">
            <label>Subject Code</label>
            <input id="subjectCode" placeholder="e.g. 22401">
        </div>

        <div class="form-group">
            <label>Topic Name / Assignment No.</label>
            <input id="topic" placeholder="e.g. Assignment No. 01">
        </div>

        <div class="form-group">
            <label>Submission Date</label>
            <input type="date" id="date">
        </div>

        <div class="form-group">
            <label>Student Name</label>
            <input id="name" placeholder="Full Name">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Registration No.</label>
                <input id="reg" placeholder="Reg No.">
            </div>
            <div class="form-group">
                <label>Roll No.</label>
                <input id="roll" placeholder="Roll No.">
            </div>
        </div>

        <div class="form-group">
            <label>Branch / Department</label>
            <select id="branch">
                <option value="">Select Branch</option>
                <option value="Electronics Engineering">Electronics Engineering</option>
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
            </select>
        </div>

        <button class="btn-print" onclick="window.print()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Print Assignment
        </button>
    </div>

    <!-- PREVIEW (A4 PAPER) -->
    <div class="preview-wrapper">
        <div class="assignment-page" id="page">
            
            <div class="header">
                <h2>Government Polytechnic Aurangabad</h2>
                <p>At :- DHANARI (824102)</p>
            </div>

            <div class="assignment-title">
                <img src="logo.png" alt="Institute Logo">
                <h2>Assignment</h2>
                <h4 id="outSub">Subject Name (Code)</h4>
            </div>

            <div class="info-section">
                <div class="info-row">
                    <div class="info-label">Topic :-</div>
                    <div class="info-value" id="outTopic"></div>
                </div>

                <div class="info-row">
                    <div class="info-label">Date :-</div>
                    <div class="info-value" id="outDate"></div>
                </div>

                <div class="info-row">
                    <div class="info-label">Name :-</div>
                    <div class="info-value" id="outName"></div>
                </div>

                <div class="info-row">
                    <div class="info-label">Reg. No :-</div>
                    <div class="info-value" id="outReg"></div>
                </div>

                <div class="info-row">
                    <div class="info-label">Branch :-</div>
                    <div class="info-value" id="outBranch"></div>
                </div>

                <div class="info-row">
                    <div class="info-label">Roll No :-</div>
                    <div class="info-value" id="outRoll"></div>
                </div>
            </div>

            <div class="signatures">
                <div class="signature-box">Student Signature</div>
                <div class="signature-box">Teacher Signature</div>
            </div>

        </div>
    </div>
</div>

<script>
    // Real-time Update Logic
    const inputs = document.querySelectorAll('input, select');
    
    function updatePreview() {
        const subject = document.getElementById("subject").value.trim();
        const subjectCode = document.getElementById("subjectCode").value.trim();
        
        let subText = "Subject Name (Code)"; // Default placeholder
        if (subject || subjectCode) {
            subText = `${subject} ${subjectCode ? `(${subjectCode})` : ''}`.trim();
        }
        document.getElementById("outSub").innerText = subText;

        // Date formatter
        let dateValue = document.getElementById("date").value;
        if(dateValue) {
            const dateObj = new Date(dateValue);
            dateValue = dateObj.toLocaleDateString('en-GB'); // Formats as DD/MM/YYYY
        }

        // Updating other fields
        document.getElementById("outTopic").innerText = document.getElementById("topic").value;
        document.getElementById("outDate").innerText = dateValue;
        document.getElementById("outName").innerText = document.getElementById("name").value;
        document.getElementById("outReg").innerText = document.getElementById("reg").value;
        document.getElementById("outBranch").innerText = document.getElementById("branch").value;
        document.getElementById("outRoll").innerText = document.getElementById("roll").value;
    }

    // Attach event listeners to update in real-time as user types
    inputs.forEach(input => {
        input.addEventListener('input', updatePreview);
    });

    // Initialize with placeholders
    updatePreview();
</script>

</body>
</html>
